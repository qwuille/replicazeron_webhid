name: Deploy WebHID with release firmware

on:
  push:
    branches: [main]
  schedule:
    # Firmware releases live in a separate repository, so periodically rebuild
    # Pages to mirror the latest published qwuille/vial-qmk release.
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out WebHID
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build site with latest release firmware
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p _site/firmware
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/

          release_json="$(curl --fail --silent --show-error --retry 3 \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/qwuille/vial-qmk/releases/latest')"
          tag="$(jq -er '.tag_name' <<<"$release_json")"
          release_url="$(jq -er '.html_url' <<<"$release_json")"
          artifacts='[]'

          package_asset() {
            local target="$1"
            local variant="$2"
            local hardware_revision="$3"
            local file="$4"
            local asset url size digest actual_size actual_digest

            asset="$(jq -ec --arg file "$file" '.assets[] | select(.name == $file)' <<<"$release_json")"
            url="$(jq -er '.browser_download_url' <<<"$asset")"
            size="$(jq -er '.size' <<<"$asset")"
            digest="$(jq -er '.digest | select(startswith("sha256:")) | sub("^sha256:"; "")' <<<"$asset")"

            curl --location --fail --silent --show-error --retry 3 \
              --output "_site/firmware/$file" "$url"
            actual_size="$(stat --format='%s' "_site/firmware/$file")"
            actual_digest="$(sha256sum "_site/firmware/$file" | cut -d' ' -f1)"

            test "$actual_size" = "$size"
            test "$actual_digest" = "$digest"

            artifacts="$(jq -c \
              --arg target "$target" \
              --arg variant "$variant" \
              --arg hardwareRevision "$hardware_revision" \
              --arg file "$file" \
              --argjson size "$size" \
              --arg sha256 "$digest" \
              '. + [{target: $target, variant: $variant, hardwareRevision: $hardwareRevision, file: $file, size: $size, sha256: $sha256}]' \
              <<<"$artifacts")"
          }

          package_asset stm32 standard 1.0 handwired_replicazeron_stm32f103_vial.bin
          package_asset stm32 directinput 1.0 handwired_replicazeron_stm32f103_directinput_vial.bin
          package_asset rp2040 full 1.0 handwired_replicazeron_rp2040_vial.uf2

          jq -n \
            --arg tag "$tag" \
            --arg releaseUrl "$release_url" \
            --argjson artifacts "$artifacts" \
            '{format: "replicazeron-release-firmware", version: 2, tag: $tag, releaseUrl: $releaseUrl, artifacts: $artifacts}' \
            > _site/firmware/manifest.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
